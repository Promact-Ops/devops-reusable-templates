name: 🚀 Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH Access to VPS
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.VPS_PRIVATE_KEY }}

      - name: 🚢 Deploy Backend via Docker Compose
        run: |
          echo "Deploying Backend on VPS..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.USERNAME }}@${{ secrets.VPS_IP }} << 'EOF'
            cd /home/ubuntu/_my_project-development-server/backend
            echo "Pulling latest changes..."
            sudo git fetch origin main && sudo git reset --hard origin/main
            cd ..
            echo "Rebuilding backend container..."
            sudo docker-compose up -d --build --force-recreate --no-deps backend
            echo "✅ Backend deployed successfully!"
          EOF
